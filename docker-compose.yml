version: '3.9'

services:
  mongo:
    image: mongo:7.0
    container_name: attendance_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: changeme
      MONGO_INITDB_DATABASE: attendance_analyzer
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      target: backend-deps
    container_name: attendance_backend
    restart: unless-stopped
    working_dir: /app/backend
    command: node server.js
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://root:changeme@mongo:27017/attendance_analyzer?authSource=admin
      JWT_SECRET: dev_jwt_secret_change_in_production_min_32_chars
      JWT_EXPIRE: 7d
      JWT_COOKIE_EXPIRE: 7
      CLIENT_URL: http://localhost:3000
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: attendance_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - '3000:5173'
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo_data:
